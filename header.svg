<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B132B"/>
      <stop offset="0.55" stop-color="#252A6E"/>
      <stop offset="1" stop-color="#583096"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <!-- monogram -->
  <circle cx="130" cy="150" r="70" fill="#0B132B" fill-opacity="0.55" stroke="#2DD4BF" stroke-width="3"/>
  <text x="130" y="168" text-anchor="middle" class="sans" font-size="54" font-weight="700" fill="#FFFFFF">LL</text>
  <rect x="104" y="182" width="52" height="4" rx="2" fill="#2DD4BF"/>

  <!-- name & title -->
  <text x="240" y="122" class="sans" font-size="58" font-weight="700" fill="#FFFFFF">Leah Levovitz</text>
  <text x="242" y="166" class="sans" font-size="26" font-weight="400" fill="#CCD6F6">Software Developer · Full-Stack &amp; AI</text>

  <!-- terminal line -->
  <g transform="translate(242,196)">
    <rect width="530" height="44" rx="10" fill="#08101F" fill-opacity="0.7" stroke="#99F6E4" stroke-opacity="0.35"/>
    <text x="18" y="29" class="mono" font-size="18" fill="#2DD4BF">$</text>
    <text x="38" y="29" class="mono" font-size="18" fill="#E6EDF7">turning complex problems into clean software</text>
    <rect class="cursor" x="504" y="14" width="10" height="18" fill="#2DD4BF"/>
  </g>

  <!-- side code accent -->
  <g class="mono" font-size="15" fill="#FFFFFF" fill-opacity="0.22">
    <text x="850" y="70">class Developer {</text>
    <text x="870" y="96">stack = [".NET", "Angular",</text>
    <text x="930" y="120">"React", "Node", "Python"];</text>
    <text x="870" y="146">ai = ["Agents", "RAG", "MCP"];</text>
    <text x="870" y="172">location = "Jerusalem";</text>
    <text x="870" y="198">openToWork = true;</text>
    <text x="850" y="224">}</text>
  </g>
</svg>
